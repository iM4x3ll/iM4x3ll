<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160" role="img"><style>
  .star { animation: shimmer 8s ease-in-out infinite; }
  .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 32s linear infinite; }
  .counter-orbit { animation-direction: reverse; animation-duration: 44s; }
  .packet { animation: packet 8s linear infinite; }
  .grid-row { animation: grid 6s linear infinite; }
  .typed-line { opacity: 0; animation: type-line 30s steps(1,end) infinite; }
  .typed-window { animation: typing 30s steps(var(--chars),end) infinite; }
  .first-line { opacity: 1; }
  .cursor { animation: blink 1.2s steps(1,end) infinite; }
  .reveal { animation: reveal .7s ease-out both; }
  .card-trace { animation: trace 14s linear infinite; }
  @keyframes shimmer { 50% { opacity: .22; } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 10%,85% { opacity: .8; } 100% { transform: translateX(360px); opacity: 0; } }
  @keyframes grid { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .28; } 80% { opacity: .28; } 100% { transform: translateY(var(--travel)); opacity: 0; } }
  @keyframes type-line { 0%,19.99% { opacity: 1; } 20%,100% { opacity: 0; } }
  @keyframes typing { 0% { width: 0; } 8%,17% { width: var(--width); } 19%,100% { width: 0; } }
  @keyframes blink { 50% { opacity: .15; } }
  @keyframes reveal { from { opacity: .15; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes trace { to { stroke-dashoffset: -1000; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .typed-line { opacity: 0; }
    .first-line { opacity: 1; }
    .typed-window { width: var(--width); }
    .grid-row { opacity: .2; }
    .cursor { opacity: .7; }
  }
</style><title>By the numbers</title><defs>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a855f7"/>
    <stop offset=".66" stop-color="#f5c451"/><stop offset="1" stop-color="#22d3ee"/>

  </linearGradient></defs><rect width="1280" height="160" rx="18" fill="#0b0d14"/><rect x=".5" y=".5" width="1279" height="159" rx="18" fill="none" stroke="#1b2030"/><text x="128" y="78" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#sweep)">3</text>
      <text x="128" y="108" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">GAME ENGINES</text><text x="128" y="125" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">IN ONE PROCESS</text>
      <text x="384" y="78" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#sweep)">90 KB</text>
      <text x="384" y="108" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">A WHOLE GAME</text><text x="384" y="125" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">LAUNCHER</text>
      <line x1="256" y1="34" x2="256" y2="126" stroke="#1b2030"/><text x="640" y="78" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#sweep)">1</text>
      <text x="640" y="108" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">COMMAND TO BUILD</text><text x="640" y="125" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">AND BOOT AN OS</text>
      <line x1="512" y1="34" x2="512" y2="126" stroke="#1b2030"/><text x="896" y="78" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#sweep)">35+</text>
      <text x="896" y="108" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">BROWSER TOOLS</text><text x="896" y="125" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">ON MY SITE</text>
      <line x1="768" y1="34" x2="768" y2="126" stroke="#1b2030"/><text x="1152" y="78" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" fill="url(#sweep)">2</text>
      <text x="1152" y="108" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">LIVE PUBLIC</text><text x="1152" y="125" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1.5" fill="#8b93a7">DEMOS</text>
      <line x1="1024" y1="34" x2="1024" y2="126" stroke="#1b2030"/></svg>
