      <text x="56" y="198" fill="#22d3ee">apps      </text><text x="190" y="198" fill="#e8ecf4">C# / .NET · WPF · WinForms · Python · PyQt</text></g><g class="reveal" style="animation-delay:1.78s">
      <text x="56" y="232" fill="#22d3ee">web       </text><text x="190" y="232" fill="#e8ecf4">Next.js · TypeScript · Fastify · Elixir · PostgreSQL</text></g><g class="reveal" style="animation-delay:2.10s">
      <text x="56" y="266" fill="#22d3ee">linux     </text><text x="190" y="266" fill="#e8ecf4">Arch · archiso · WSL2 · Hyper-V · Bash · PowerShell</text></g><g class="reveal" style="animation-delay:2.42s">
      <text x="56" y="300" fill="#22d3ee">ai        </text><text x="190" y="300" fill="#e8ecf4">Ollama · Open WebUI · custom agents · a Python voice assistant</text></g><g class="reveal" style="animation-delay:2.74s">
      <text x="56" y="334" fill="#22d3ee">lab       </text><text x="190" y="334" fill="#e8ecf4">Plex · Pi-hole · Nextcloud · Home Assistant · Tailscale</text></g><g class="reveal" style="animation-delay:3.06s">
      <text x="56" y="368" fill="#22d3ee">rig       </text><text x="190" y="368" fill="#e8ecf4">Ryzen 7 9800X3D · RTX 5070 Ti · 45" 240 Hz OLED ultrawide</text></g><g class="reveal" style="animation-delay:3.38s">
      <text x="56" y="402" fill="#22d3ee">play      </text><text x="190" y="402" fill="#e8ecf4">sim racing · VR · modding RDR2, GTA and BeamNG</text></g>
    <text x="56" y="442" fill="#f5c451">$</text>
