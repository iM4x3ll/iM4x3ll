      <g font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" fill="#edf1e8"><text x="72" y="292"><tspan fill="#d6ab3c">1.</tspan> three game engines, one process, one portal</text><text x="72" y="319"><tspan fill="#d6ab3c">2.</tspan> a Linux distro that builds and boots from one command</text><text x="72" y="346"><tspan fill="#d6ab3c">3.</tspan> a whole game launcher in 90 KB</text><text x="72" y="373"><tspan fill="#d6ab3c">4.</tspan> local AI on one GPU, nothing leaves the house</text><text x="72" y="400"><tspan fill="#d6ab3c">5.</tspan> IT for law firms and courtrooms, 9 to 5</text></g></g>
