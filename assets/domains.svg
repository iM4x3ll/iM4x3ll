      <text x="1234" y="222" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="12" fill="#f87171">08</text>
      <text x="982" y="256" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#e8ecf4">Home lab</text>
      <text x="982" y="286" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#8b93a7">Media server, DNS filtering,</text><text x="982" y="307" font-family="'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#8b93a7">private cloud and remote access.</text></g></svg>
