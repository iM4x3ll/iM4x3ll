<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 436" width="1280" height="436" role="img"><style>
  .pulse { stroke-dasharray: 5 120; stroke-dashoffset: 5; animation: pulse 6s linear infinite; }
  .led { animation: led 2.4s steps(1,end) infinite; }
  @keyframes pulse { 0% { stroke-dashoffset: 5; opacity: 0; } 6%,80% { opacity: 1; } 100% { stroke-dashoffset: -100; opacity: 0; } }
  @keyframes led { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { opacity: 0; } }
</style><title>What I do</title>
  
  <defs><clipPath id="board"><rect width="1280" height="436" rx="14"/></clipPath></defs>
  <g clip-path="url(#board)"><rect width="1280" height="436" fill="#0b2e22"/>
    <circle cx="26" cy="26" r="12" fill="#d6ab3c"/><circle cx="26" cy="26" r="7.0" fill="#05130d"/><circle cx="1254" cy="26" r="12" fill="#d6ab3c"/><circle cx="1254" cy="26" r="7.0" fill="#05130d"/><circle cx="26" cy="410" r="12" fill="#d6ab3c"/><circle cx="26" cy="410" r="7.0" fill="#05130d"/><circle cx="1254" cy="410" r="12" fill="#d6ab3c"/><circle cx="1254" cy="410" r="7.0" fill="#05130d"/>
    <text x="72" y="58" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#edf1e8">J2 · WHAT I DO</text>
    <text x="1208" y="58" text-anchor="end" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#a3c2b1">8-pin header · 2.54 mm pitch</text>
    <rect x="74" y="86" width="24" height="24" rx="2" fill="#d6ab3c"/><circle cx="86" cy="98" r="5" fill="#05130d"/>
      <text x="118" y="104" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">1</text>
      <text x="148" y="104" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Infrastructure &amp; IT</text>
      <text x="148" y="128" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Windows fleets, Active Directory,</text><text x="148" y="148" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">courtroom setups, MSP ticket work.</text><circle cx="694" cy="98" r="12" fill="#d6ab3c"/><circle cx="694" cy="98" r="5" fill="#05130d"/>
      <text x="726" y="104" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">2</text>
      <text x="756" y="104" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Systems programming</text>
      <text x="756" y="128" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Three game engines sharing one</text><text x="756" y="148" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">process and one Direct3D device.</text><circle cx="86" cy="178" r="12" fill="#d6ab3c"/><circle cx="86" cy="178" r="5" fill="#05130d"/>
      <text x="118" y="184" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">3</text>
      <text x="148" y="184" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Operating systems</text>
      <text x="148" y="208" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">My own Arch-based distro, built</text><text x="148" y="228" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">and booted by a single script.</text><circle cx="694" cy="178" r="12" fill="#d6ab3c"/><circle cx="694" cy="178" r="5" fill="#05130d"/>
      <text x="726" y="184" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">4</text>
      <text x="756" y="184" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Desktop software</text>
      <text x="756" y="208" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Native Windows apps in C# and</text><text x="756" y="228" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Python. One is a 90 KB launcher.</text><circle cx="86" cy="258" r="12" fill="#d6ab3c"/><circle cx="86" cy="258" r="5" fill="#05130d"/>
      <text x="118" y="264" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">5</text>
      <text x="148" y="264" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Web platforms</text>
      <text x="148" y="288" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Next.js sites, live data APIs,</text><text x="148" y="308" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">and a real-time chat backend.</text><circle cx="694" cy="258" r="12" fill="#d6ab3c"/><circle cx="694" cy="258" r="5" fill="#05130d"/>
      <text x="726" y="264" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">6</text>
      <text x="756" y="264" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Local AI</text>
      <text x="756" y="288" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Self-hosted models, custom agents,</text><text x="756" y="308" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">and a voice assistant on one GPU.</text><circle cx="86" cy="338" r="12" fill="#d6ab3c"/><circle cx="86" cy="338" r="5" fill="#05130d"/>
      <text x="118" y="344" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">7</text>
      <text x="148" y="344" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Game dev &amp; modding</text>
      <text x="148" y="368" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">A co-op Roblox game, engine mods,</text><text x="148" y="388" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">RDR2, GTA and BeamNG tinkering.</text><circle cx="694" cy="338" r="12" fill="#d6ab3c"/><circle cx="694" cy="338" r="5" fill="#05130d"/>
      <text x="726" y="344" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#d6ab3c">8</text>
      <text x="756" y="344" font-family="Bahnschrift,'DIN Alternate','DIN 2014','Barlow Semi Condensed','Roboto Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="700" letter-spacing=".5" fill="#edf1e8">Home lab</text>
      <text x="756" y="368" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">Media server, DNS filtering,</text><text x="756" y="388" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#a3c2b1">private cloud and remote access.</text></g>
